trigger:
  - feature/101

pool:
  name: 'AgentUserDefinedPool'

steps:
- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'anuj-pipeline-sc'
    backendAzureRmStorageAccountName: 'anujsrr121'
    backendAzureRmContainerName: 'meracontainer'
    backendAzureRmKey: 'terraform.tfstate'