trigger:
  - feature

pool:
  name: 'AgentUserDefinedPool'

steps:

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  - powershell: |
      where.exe terraform
      terraform version
    displayName: 'Check Terraform'

  - task: TerraformTask@5
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)\infra-01'
      backendServiceArm: 'anuj-pipeline-sc'
      backendAzureRmStorageAccountName: 'anujsrr121'
      backendAzureRmContainerName: 'meracontainer'
      backendAzureRmKey: 'terraform.tfstate'