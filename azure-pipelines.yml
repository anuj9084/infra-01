    inputs:
      azureSubscription: 'anuj-ka-sc'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd INFRA-01
        terraform init
        terraform fmt
        terraform validate
        terraform plan